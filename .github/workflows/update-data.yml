name: Aggiorna dati MMA/UFC

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegui script di recupero dati
        run: node scripts/fetch-mma.js

      - name: Salva i dati aggiornati (se cambiati)
        run: |
          git config user.name "combat-oracle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/fighters.json
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo oggi, niente da salvare."
          else
            git commit -m "Aggiornamento dati automatico $(date -u +%Y-%m-%d)"
            git push
          fi
